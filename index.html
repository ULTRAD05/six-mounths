<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Mi Historia</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            width: 100%;
            height: 100vh;

            overflow: hidden;

            font-family: Georgia, "Times New Roman", serif;

            background: #000;

            transition: opacity 1s ease;

        }


        /* =========================
           VIDEO DE FONDO
        ========================= */

        .video-fondo {

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;

            z-index: -2;

        }


        /* =========================
           FILTRO OSCURO
        ========================= */

        .filtro {

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background:
                radial-gradient(
                    circle,
                    rgba(0,0,0,0.20),
                    rgba(0,0,0,0.75)
                );

            z-index: -1;

        }


        /* =========================
           PORTADA
        ========================= */

        .portada {

            width: 100%;
            height: 100vh;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            text-align: center;

            color: white;

        }


        /* =========================
           TITULO
        ========================= */

        .titulo {

            font-size: clamp(45px, 8vw, 90px);

            letter-spacing: 5px;

            text-transform: uppercase;

            text-shadow:
                0 0 10px rgba(255,255,255,0.5),
                0 5px 20px black;

            animation: aparecer 2s ease;

        }


        /* =========================
           SUBTITULO
        ========================= */

        .subtitulo {

            margin-top: 15px;

            font-size: 20px;

            letter-spacing: 3px;

            opacity: 0.85;

            animation: aparecer 3s ease;

        }


        /* =========================
           BOTON
        ========================= */

        .comenzar {

            margin-top: 55px;

            padding: 17px 45px;

            background: rgba(0,0,0,0.35);

            color: white;

            border: 2px solid rgba(255,255,255,0.8);

            border-radius: 50px;

            font-family: Georgia, serif;

            font-size: 19px;

            letter-spacing: 2px;

            cursor: pointer;

            backdrop-filter: blur(5px);

            animation: latido 1.8s infinite;

            transition: 0.3s;

        }


        .comenzar:hover {

            background: rgba(255,255,255,0.15);

            transform: scale(1.08);

        }


        /* =========================
           ANIMACION APARECER
        ========================= */

        @keyframes aparecer {

            from {

                opacity: 0;

                transform: translateY(30px);

            }

            to {

                opacity: 1;

                transform: translateY(0);

            }

        }


        /* =========================
           ANIMACION LATIDO
        ========================= */

        @keyframes latido {

            0% {

                transform: scale(1);

                box-shadow:
                    0 0 0 0
                    rgba(255,255,255,0.5);

            }

            50% {

                transform: scale(1.06);

                box-shadow:
                    0 0 0 12px
                    rgba(255,255,255,0);

            }

            100% {

                transform: scale(1);

                box-shadow:
                    0 0 0 0
                    rgba(255,255,255,0);

            }

        }


        /* =========================
           CELULAR
        ========================= */

        @media(max-width:600px) {

            .subtitulo {

                font-size: 16px;

            }

            .comenzar {

                font-size: 16px;

                padding: 15px 35px;

            }

        }

    </style>

</head>


<body>


    <!-- =========================
         VIDEO DE FONDO
    ========================= -->

    <video
        class="video-fondo"
        autoplay
        muted
        loop
        playsinline>

        <source
            src="2026-09-19 21-23-24.mp4"
            type="video/mp4">

    </video>


    <!-- =========================
         AUDIO
    ========================= -->

    <audio
        id="musica"
        loop
        preload="auto">

        <source
            src="Sonido del Mar Relajante.mp3"
            type="audio/mpeg">

    </audio>


    <!-- =========================
         FILTRO
    ========================= -->

    <div class="filtro"></div>


    <!-- =========================
         PORTADA
    ========================= -->

    <main class="portada">

        <h1 class="titulo">
            Mi Historia
        </h1>


        <p class="subtitulo">
            Un viaje que está a punto de comenzar...
        </p>


        <button
            class="comenzar"
            id="botonComenzar">

            ✦ Comenzar historia ✦

        </button>

    </main>


    <!-- =========================
         JAVASCRIPT
    ========================= -->

    <script>

        var musica =
            document.getElementById("musica");

        var boton =
            document.getElementById("botonComenzar");


        /* =========================
           VOLUMEN 30%
        ========================= */

        musica.volume = 0.3;


        /* =========================
           INICIAR MUSICA CON
           EL PRIMER CLIC
        ========================= */

        function iniciarMusica() {

            if (musica.paused) {

                musica.volume = 0.3;

                musica.play().catch(function(error) {

                    console.log(
                        "No se pudo reproducir el audio:",
                        error
                    );

                });

            }

        }


        /* =========================
           CUALQUIER CLIC EN LA PAGINA
           INICIA LA MUSICA
        ========================= */

        document.addEventListener(
            "click",
            iniciarMusica,
            {
                once: true
            }
        );


        /* =========================
           BOTON COMENZAR
        ========================= */

        boton.addEventListener(
            "click",
            function(event) {

                /* Asegurar que la música
                   esté reproduciéndose */

                iniciarMusica();


                /* Desactivar botón */

                boton.disabled = true;


                /* Desvanecer página */

                document.body.style.opacity = "0";


                /* Ir a pag1 */

                setTimeout(function() {

                    window.location.href =
                        "pag1.html";

                }, 1000);

            }
        );

    </script>


</body>

</html>
